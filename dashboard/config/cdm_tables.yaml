    code_columns: [VX_CODE, VX_STATUS, VX_SOURCE, VX_ROUTE, VX_MANUFACTURER]
    code_type_columns: [VX_CODE_TYPE]
    person_id: PATID
    encounter_id: ENCOUNTERID
    description: Immunization records.

  obs_clin:
    domain: observation
    label: OBS_CLIN
    expected_file: obs_clin.sas7bdat
    primary_key: [OBSCLINID]
    required_columns: [PATID, OBSCLIN_START_DATE]
    date_columns: [OBSCLIN_START_DATE, OBSCLIN_STOP_DATE]
    code_columns: [OBSCLIN_CODE, OBSCLIN_RESULT_SNOMED, OBSCLIN_SOURCE]
    code_type_columns: [OBSCLIN_TYPE]
    person_id: PATID
    encounter_id: ENCOUNTERID
    description: Clinical observations.

  obs_gen:
    domain: observation
    label: OBS_GEN
    expected_file: obs_gen.sas7bdat
    primary_key: [OBSGENID]
    required_columns: [PATID, OBSGEN_START_DATE]
    date_columns: [OBSGEN_START_DATE, OBSGEN_STOP_DATE]
    code_columns: [OBSGEN_CODE, OBSGEN_TABLE_MODIFIED, OBSGEN_SOURCE]
    code_type_columns: [OBSGEN_TYPE]
    person_id: PATID
    encounter_id: ENCOUNTERID
    description: General observations.
